<script>
  function applyDynamicScale() {
    const body = document.body;

    // Measure content width before scaling
    const baseWidth = body.scrollWidth;

    // Viewport width
    const viewportWidth = window.innerWidth;

    // Compute scale (shrink only)
    const scale = Math.min(viewportWidth / baseWidth, 1);

    // Apply transform
    body.style.transform = `scale(${scale})`;
    body.style.transformOrigin = "top left";
    body.style.width = `${100 / scale}%`;

    // Prevent extra whitespace
    body.style.margin = "0";
    body.style.padding = "0";
    document.documentElement.style.overflowX = "hidden";
  }

  // Run after layout stabilizes
  window.addEventListener("load", () => {
    requestAnimationFrame(applyDynamicScale);
  });

  // Recalculate on resize
  window.addEventListener("resize", () => {
    requestAnimationFrame(applyDynamicScale);
  });
</script>
