<script>
  window.addEventListener("load", () => {
    // Step 1: Measure the natural layout width
    const baseWidth = document.documentElement.scrollWidth;

    // Step 2: Determine the current viewport width
    const viewportWidth = window.innerWidth;

    // Step 3: Compute scale ratio (only shrink, never enlarge)
    const scale = Math.min(viewportWidth / baseWidth, 1);

    // Step 4: Apply scaling
    document.documentElement.style.transform = `scale(${scale})`;
    document.documentElement.style.transformOrigin = "top left";
    document.documentElement.style.width = `${100 / scale}%`;

    // Step 5: Optional — handle resizes dynamically
    window.addEventListener("resize", () => {
      const newViewportWidth = window.innerWidth;
      const newScale = Math.min(newViewportWidth / baseWidth, 1);
      document.documentElement.style.transform = `scale(${newScale})`;
      document.documentElement.style.width = `${100 / newScale}%`;
    });
  });
</script>

  <body>
    <div id="root"></div>
  </body>
